[package]
name = "dvd-ripper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dvd-ripper"
path = "src/main.rs"

[[bin]]
name = "dvd-ripper-installer"
path = "src/bin/installer.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.29", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
