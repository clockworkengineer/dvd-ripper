[package]
name = "dvd-ripper"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
windows = { version = "0.58.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.29"
