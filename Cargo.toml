[package]
name = "dvd-ripper"
version = "0.2.0"
edition = "2024"
default-run = "dvd-ripper"
description = "A fast, portable DVD backup utility written in Rust featuring both a Portable Native Desktop GUI (eframe/egui) and CLI/Daemon modes."
authors = ["Rob Tizzard <clockworkengineer@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/clockworkengineer/dvd-ripper"
documentation = "https://github.com/clockworkengineer/dvd-ripper#readme"
keywords = ["dvd", "ripper", "backup", "media", "ffmpeg"]
categories = ["command-line-utilities", "multimedia::video"]

[[bin]]
name = "dvd-ripper"
path = "src/main.rs"

[[bin]]
name = "dvd-ripper-installer"
path = "src/bin/installer.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image", "dep:rfd"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.29", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[package.metadata.deb]
name = "dvd-ripper"
maintainer = "Rob Tizzard <clockworkengineer@users.noreply.github.com>"
copyright = "2024-2026 Rob Tizzard"
extended-description = """\
DVD Ripper is a high-performance, automated DVD backup and transcoding utility \
written in Rust, featuring both a responsive native desktop GUI and headless \
CLI/Daemon appliance modes."""
depends = "$auto, ffmpeg"
section = "video"
priority = "optional"
assets = [
    ["target/release/dvd-ripper", "usr/local/bin/", "755"],
    ["contrib/dvd-ripper.service", "etc/systemd/system/", "644"],
    ["contrib/99-dvd-ripper.rules", "etc/udev/rules.d/", "644"],
    ["README.md", "usr/share/doc/dvd-ripper/README.md", "644"],
]

